name: Shop Helper tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/bundle-per-player-limit]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run unit and integration tests
        run: npm test --prefix shop-helper
